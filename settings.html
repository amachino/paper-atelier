<button class="reader-settings-trigger" id="reader-settings-open" type="button" aria-haspopup="dialog" aria-controls="reader-settings" aria-expanded="false" hidden>Appearance</button>
<dialog class="reader-settings-dialog" id="reader-settings" aria-labelledby="reader-settings-title" aria-describedby="reader-settings-description">
  <div class="reader-settings-heading"><h2 id="reader-settings-title">Reading settings</h2><button class="reader-settings-close" id="reader-settings-close" type="button" autofocus>Close</button></div>
  <p id="reader-settings-description">Choose how the paper looks. Changes apply immediately.</p>
  <fieldset><legend>Text size</legend><div class="reader-settings-choices reader-settings-sizes">
    <label><input type="radio" name="reader-size" value="small" checked><span>Small</span></label>
    <label><input type="radio" name="reader-size" value="medium"><span>Medium</span></label>
    <label><input type="radio" name="reader-size" value="large"><span>Large</span></label>
  </div></fieldset>
  <fieldset><legend>Text font</legend><div class="reader-settings-choices">
    <label><input type="radio" name="reader-font" value="serif" checked><span>Serif</span></label>
    <label><input type="radio" name="reader-font" value="sans"><span>Sans-serif</span></label>
  </div></fieldset>
  <fieldset><legend>Appearance</legend><div class="reader-settings-choices">
    <label><input type="radio" name="reader-theme" value="light" checked><span>Light</span></label>
    <label><input type="radio" name="reader-theme" value="dark"><span>Dark</span></label>
  </div></fieldset>
  <button class="reader-settings-reset" id="reader-settings-reset" type="button">Reset to defaults</button>
  <p class="reader-settings-help">Saved across both papers in this browser only. Figures keep their original colors.</p>
  <p id="reader-settings-status" class="visually-hidden" role="status" aria-live="polite"></p>
</dialog>
